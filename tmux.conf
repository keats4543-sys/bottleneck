# bottleneck tmux bindings. Sourced into ~/.tmux.conf by install.sh.
#
# Layout: one window, two panes - dashboard on the left, the head you are
# working with on the right. Everything else waits in hidden windows.
#
# No-prefix keys (work while you are typing at a head):
#   Alt+d      back to the dashboard
#   Alt+Left / Alt+Right   move between the two panes
#   Alt+a      jump to whichever head needs you most
#   Alt+Enter  press Enter at this head, then move on
# With prefix (Ctrl+b by default):
#   F          build/focus the two-pane layout
#   a          jump to the head that needs you most
#   Enter      same as Alt+Enter, for terminals that eat it
#   R          reload bindings and the dashboard after editing the checkout

set -g mouse on

# Scrollback, and why this is not the usual 50000.
#
# tmux keeps every line of it in the server, and a line of Claude Code output is
# not a cheap one: measured on a real fleet, a 179-column head pane cost 4.9 to
# 6.6 KB a line once colour and attributes were stored, so a full 50000-line
# history came to over 300MB per busy head. Three panes held 560MB between them
# and the server was the largest resident thing on the box after the heads.
#
# That is not an abstract cost. The tmux server is the single process that has
# to carry out every pane move, so once the box starts paging it is the thing
# you are waiting for - the switching this exists to make fast, queued behind
# memory the fleet was never going to read. 5000 lines is still far more
# scrollback than anyone reads off a head, and costs a tenth of it.
set -g history-limit 5000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on
setw -g pane-border-status top
setw -g pane-border-format " #{?#{==:#{@bottleneck_role},dash},bottleneck,#{pane_title}} "

# --- what these keys cost -------------------------------------------------
#
# Everything below started life as `run-shell "bottleneck ..."`, which starts a
# python process: some 130ms of interpreter and imports before a line of work,
# then a dozen more forks inside it to ask tmux where things are. A quarter of a
# second to move a pane, and you feel every one of them.
#
# They name the program by its path rather than by its name. tmux forks these
# from the server, and that shell's PATH is the server's - whatever the
# environment happened to be when the server started, which can easily be from
# before bottleneck was installed. run-shell -b throws "command not found"
# away, so the key does nothing at all, silently, and reads as a broken binding
# rather than a stale PATH. (~ is expanded by the shell that runs the command,
# and install.sh puts the symlinks there. The dashboard's own fallbacks do not
# need this: it is the program, so it writes its own path in - see our_path in
# tmuxio.py.)
#
# So the bindings written here are only the fallback - correct, and slow. A
# running dashboard rebinds them to plain tmux commands against its own pane id
# (see dash_keys in bottleneck/tmuxio.py), because it knows where it is and tmux
# can be told a pane at bind time. Pressed then, they never leave tmux at all.
# `bottleneck reload` and quitting the dashboard both put these back.

# --- no-prefix, so they work mid-typing at a head -------------------------
bind -n M-d run-shell -b "~/.local/bin/bottleneck todash"
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R

# One key both ways: on a head it puts you on the list, on the list it puts you
# back in the head. Alt+o because Alt+d only goes one way, and reaching for the
# mouse to get at the queue is the tax this whole thing exists to remove.
bind -n M-o run-shell -b "~/.local/bin/bottleneck swap"
bind    o   run-shell -b "~/.local/bin/bottleneck swap"

# Straight to the next head that wants you, without going via the dashboard.
# With nothing waiting it parks the head you just answered and shows the queue;
# pressed again it cycles the heads still working. It never reports anything -
# run-shell turns output into a popup window, so silence is the feature.
# M-j matches the dashboard's own j; M-a is the older name for it.
bind -n M-j run-shell -b "~/.local/bin/bottleneck next --jump"
bind -n M-a run-shell -b "~/.local/bin/bottleneck next --jump"

# Same thing, but presses Enter at the head you are sitting in first: one key
# for "send this prompt and take me to whatever is next".
#
# This one cannot be pure tmux: it has to press Enter at the head, wait for the
# harness to come out of idle, and only then read the queue. But the dashboard
# is already running and already holds all of that, so the key writes it one
# line down a fifo instead of starting a second copy of the program. `timeout`
# is the guard: with no dashboard listening the write cannot complete, and after
# a third of a second it gives up and does it the slow way instead.
#
# Note: Claude Code reads Alt+Enter as "newline, do not submit". tmux takes the
# key first, so while this is bound you lose that way of writing a second line
# (Shift+Enter and \<Enter> still work). Swap the key here if you want it back -
# any free one will do, e.g. M-'.
bind -n M-Enter run-shell -b "timeout 0.3 sh -c '[ -p ~/.bottleneck/ctl ] && echo sendgo #{pane_id} > ~/.bottleneck/ctl' 2>/dev/null || ~/.local/bin/bottleneck send-go"
bind M-Enter    run-shell -b "timeout 0.3 sh -c '[ -p ~/.bottleneck/ctl ] && echo sendgo #{pane_id} > ~/.bottleneck/ctl' 2>/dev/null || ~/.local/bin/bottleneck send-go"
bind Enter      run-shell -b "timeout 0.3 sh -c '[ -p ~/.bottleneck/ctl ] && echo sendgo #{pane_id} > ~/.bottleneck/ctl' 2>/dev/null || ~/.local/bin/bottleneck send-go"

# Not C-j: that is the linefeed character. Terminals send it for Shift+Enter,
# which Claude Code reads as "newline, do not submit" - tmux would eat it first
# and you could no longer write a second line. Uncomment only if you never use
# Shift+Enter and your terminal sends C-m (not C-j) for plain Enter:
# bind -n C-j run-shell "bottleneck next --jump"

# --- with prefix ---------------------------------------------------------
bind a run-shell -b "~/.local/bin/bottleneck next --jump"
bind o run-shell -b "~/.local/bin/bottleneck swap"
bind F run-shell "~/.local/bin/bottleneck start"

# Re-read this file and restart the dashboard pane, after editing the checkout.
# The heads keep running - they are their own processes. Output goes nowhere on
# purpose: run-shell turns it into a popup window.
bind R run-shell "~/.local/bin/bottleneck reload >/dev/null 2>&1"

# The configured keys, which win over everything above.
#
# The bindings above are the bootstrap: what a tmux that has never run
# bottleneck falls back on, so `prefix F` can start one. This file is written
# from BOTTLENECK_KEY_* in ~/.bottleneck/config every time bottleneck starts,
# watches or reloads, and it unbinds every default before binding what you
# asked for - so taking a key out of the config really does take it off the
# keyboard. -q because it does not exist until bottleneck has run once.
#
# If you have set BOTTLENECK_STATE elsewhere, point this at your own state
# directory: tmux cannot read the config file that would have told it.
source-file -q ~/.bottleneck/keys.conf

# Attention counter. Colour tracks the worst state.
#
# `#(bottleneck bar)` here meant tmux started a python process every
# status-interval, for ever: 190-350ms of interpreter, imports and a cold read
# of every transcript, to recount something the dashboard had just counted. On
# a two-core box with a fleet on it that is not background noise.
#
# So the dashboard writes the answer into a server option as it redraws, and
# this reads it. No process, and the count is as fresh as the list is. With no
# dashboard running the option is unset and this goes blank, which is the true
# answer: nothing is maintaining a count.
set -g status-interval 5
set -g status-right-length 60
set -g status-right "#{@bottleneck_bar} %H:%M "
set -g status-left-length 30
set -g status-left " #[bold]#S#[default] "
set -g status-style "bg=colour235,fg=colour250"
setw -g window-status-current-style "bold,fg=colour231,bg=colour24"
